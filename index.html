<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برای حنا 🫶🏻</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#ffd6e5,#fff0f6,#ffc1d9);
  font-family:Tahoma,Arial,sans-serif; color:#6b2948;
}
.card{
  position:relative; z-index:2;
  width:min(92%,720px); padding:42px 24px;
  text-align:center;
  background:rgba(255,255,255,.9);
  border:3px solid #ff9fc3;
  border-radius:32px;
  box-shadow:0 18px 60px rgba(190,70,120,.22);
}
h1{margin:0 0 18px;font-size:34px}
p{margin:0;font-size:21px;line-height:2.25}
.heart{
  position:absolute; bottom:-60px; font-size:28px;
  animation:float 7s linear infinite; opacity:.8;
}
@keyframes float{
  0%{transform:translateY(0) rotate(0);opacity:0}
  15%{opacity:.85}
  100%{transform:translateY(-115vh) rotate(25deg);opacity:0}
}
.h1{left:8%;animation-delay:0s}.h2{left:22%;animation-delay:2s}
.h3{left:40%;animation-delay:4s}.h4{left:62%;animation-delay:1s}
.h5{left:82%;animation-delay:3s}
</style>
</head>
<body>
<div class="heart h1">💗</div><div class="heart h2">💕</div>
<div class="heart h3">🩷</div><div class="heart h4">💖</div>
<div class="heart h5">🫶🏻</div>

<div class="card">
  <h1>برای حنا 🩷</h1>
  <p>
    بعضی آدما رو نمیشه با چندتا کلمه توصیف کرد..<br>
    فقط میشه گفت بودنشون یه گوشه‌ی قشنگ از زندگیته..<br>
    تو برام دقیقا همون آدمی :)<br>
    خلاصه بیشتر از چیزی که فکرشو کنی دوست دارم خرِ من 🫶🏻🫶🏻<br>
    واس اینم خیلی پاره شدم تا درستش کنم پ زیاد ذوق کن 🤣🤣🤣
  </p>
</div>
</body>
</html>
